[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-pdf-to-docx"
version = "0.2.0"
description = "Hybrid Vietnamese scanned administrative PDF/A to DOCX converter (PyMuPDF + OpenCV red-seal removal + RapidOCR + VietOCR + 1-shot Gemini text correction + python-docx)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "pydantic>=2.7.0",
    "google-genai>=1.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "PyQt5>=5.15.0",
    "rapidocr-onnxruntime>=1.3.0",
    "vietocr>=0.3.11",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.scripts]
vn-pdf-to-docx = "vn_pdf_to_docx.cli:main"
vn-pdf-gui = "vn_pdf_to_docx.gui:main"

[tool.setuptools.packages.find]
include = ["vn_pdf_to_docx*"]
